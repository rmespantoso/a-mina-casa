<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planifica tu espacio · A miña casa (prototipo)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <!-- «¿Qué me cabe?» se ha convertido en «Planifica tu espacio» (14/11/2026).
       Esta página solo reenvía los enlaces antiguos: si traen estancia y medidas, las conserva. -->
  <script>
    (function () {
      var antes = new URLSearchParams(window.location.search);
      var destino = "planifica.html";
      if (/^[a-z]{3,12}$/.test(antes.get("e") || "")) {
        var nuevos = new URLSearchParams({ e: antes.get("e") });
        ["a", "f", "h"].forEach(function (clave) { if (antes.get(clave)) nuevos.set(clave, antes.get(clave)); });
        destino = "espacio.html?" + nuevos.toString();
      }
      window.location.replace(destino);
    })();
  </script>
</head>
<body>
  <main class="pagina">
    <h1>Planifica tu espacio</h1>
    <p>«¿Qué me cabe?» ahora se llama «Planifica tu espacio». <a href="planifica.html">Ir a Planifica tu espacio</a>.</p>
  </main>
</body>
</html>
