<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planifica tu espacio · A miña casa (prototipo)</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header id="cabecera" class="cabecera"></header>

  <main id="contenido" class="pagina">
    <p><a class="enlace-volver" href="index.html">← Otras estancias</a></p>
    <div class="portada-estancia" id="portada"></div>
    <h1 id="titulo">Planifica tu espacio</h1>
    <p class="entrada">Dinos qué buscas, qué medidas quieres, tu precio y tus colores. Al pulsar «Buscar artículos» te enseñamos los muebles que encajan.</p>

    <!-- El filtro lo pinta js/filtro.js (el mismo que usa «Añadir artículo» en Mi plano 3D). -->
    <form class="formulario" id="formulario-plan" novalidate hidden></form>

    <!-- Avisos (los muebles se ven en resultados.html) -->
    <section id="resultados" aria-live="polite"></section>
  </main>

  <footer id="pie" class="pie"></footer>

  <script type="module" src="js/pantallas/espacio.js"></script>
</body>
</html>
